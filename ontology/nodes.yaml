# Agent Node Registry
#
# Three-layer structure:
#   layer 1 — Intake & Understanding
#   layer 2 — Execution
#   layer 3 — Quality & Output
#
# Concrete model IDs are intentionally not stored on nodes. Users may run
# Silicon Org with different providers or local models. Model guidance is
# capability-based in org/MODELS.md, and the Runtime's current/default model is
# used unless the user configures optional overrides.

