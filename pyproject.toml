[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-org"
version = "0.6.0"
description = "Dynamic Workflow, with a harness - Graph, Policy, Ledger, Runtime, and Learning kernel."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
langgraph-oss = [
  "langgraph==0.6.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["learning*", "runtime*", "tools*"]
namespaces = true
