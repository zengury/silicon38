  compressed_context:
    decisions:
    - statement: Canonical Model 采用扁平结构，battery/joints/cpu/network/task/location 六大域
      source: 'to-prd: Canonical Model type definition'
      impact: ADR-002 细化为完整 TypeScript 类型定义 + 单位标准化规则
    - statement: Adapter Pipeline 三阶段：parse → mapFields → normalizeUnits
      source: 'to-prd: Schema Adapter Pipeline 概念'
      impact: ADR-003 细化为接口定义、注册机制、错误处理策略
    - statement: 实时架构：Backend Aggregation Service → WebSocket → SPA State Store →
        UI
      source: 'to-prd: Implementation Decision #4'
      impact: ADR-004 定义完整数据流、消息格式、重连策略
    - statement: 告警规则 DSL + 状态机
      source: 'to-prd: Alert Engine 设计'
      impact: ADR-005 细化为 9 条预设规则 + pending→active→acknowledged→resolved 状态机
    - statement: 前端 Zustand 多 Store 架构
      source: 'to-prd: Implementation Decision #3 (Zustand 选型)'
      impact: ADR-006 定义 7 个独立 Store 及其职责边界
    - statement: 前端模块划分：Dashboard、Detail、Alert、Config、Collab、Export、Theme/i18n/Layout
      source: 'to-prd: 模块划分表'
      impact: ADR-006 组件树结构反映模块边界
    constraints:
    - statement: SPA 纯前端架构，无 SSR
      source: 'to-prd: Implementation Decision #1'
      impact: ADR-001 选择的 SPA 架构符合该约束
    - statement: 系统只读监控，不包含机器人遥控
      source: 'to-prd: Out of Scope'
      impact: WebSocket 只需 server→client 推送，不需双向控制指令
    - statement: Demo 阶段单用户、localhost 部署
      source: 'to-prd: Further Notes (mock data)'
      impact: ADR-008 部署拓扑简化为单机双进程
    - statement: 中/英双语
      source: 'to-prd: Further Notes'
      impact: ADR-006 包含 I18nProvider，ADR-007 选型 react-i18next
    assumptions:
    - statement: 后端聚合服务由本团队构建（Demo 阶段的前端工程师可兼做 Mock Server）
      source: 'to-prd: assumption ''后端聚合服务已存在或可以独立构建'''
      risk: low — Mock Server 复杂度可控，Bun + ws 即可
    - statement: 20 台机器人足以演示
      source: to-prd / to-issues shared assumption
      risk: low — 架构支持扩展到 100+ 台
    - statement: 地图服务使用 Leaflet + OpenStreetMap
      source: 'to-prd: Further Notes (Leaflet 作为备选)'
      risk: medium — 中国大陆访问 OSM tile 可能慢，需预留国内地图服务切换方案
    open_questions:
    - statement: 生产环境下 Backend Aggregation Service 的部署和维护归属
      source: 'to-prd: open_question'
      owner: user / release-manager
    - statement: 30 天历史数据的存储方案（内存 vs 时序数据库）
      source: 'to-prd: open_question'
      owner: database-engineer (production phase)
    - statement: 多人并发协作的冲突策略
