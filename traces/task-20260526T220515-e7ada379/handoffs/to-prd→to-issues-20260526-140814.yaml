  compressed_context:
    decisions:
    - statement: 定义 Canonical Model 统一异构机器人数据
      source: 'user requirement #2: 数据格式不统一'
      impact: 所有下游模块（UI、告警、历史、导出）都基于此模型构建
    - statement: 采用 SPA + WebSocket 推送的实时架构
      source: 'user requirement #1: 实时显示数据'
      impact: 前端不需要轮询，后端负责数据归一化和推送
    - statement: 告警引擎使用可配置规则 DSL
      source: 'user requirement #6: 工程师可调整告警阈值'
      impact: 告警引擎与 UI 解耦，规则持久化存储
    - statement: 前端技术栈 React 18 + TypeScript + ECharts + Tailwind
      source: 'user requirements #3 (多图表) + #9 (主题切换)'
      impact: 图表库选型确定，布局和主题方案确定
    constraints:
    - statement: 系统只读监控，不包含机器人遥控
      source: scope boundary decision
      impact: 不需要双向通信，简化实时通道设计
    - statement: 总览数据 1Hz、详情 5Hz 的更新频率
      source: 实时性需求估算
      impact: 约束 WebSocket 消息量和前端渲染帧率
    - statement: 支持中/英双语
      source: 'user requirement #9'
      impact: 所有 UI 文案需通过 i18n 框架管理
    assumptions:
    - statement: 后端聚合服务已存在或可以独立构建
      source: PRD 只定义前端和接口契约
      risk: medium — 若后端也需要本团队构建，需增加架构师参与范围
    - statement: 30 天历史数据可通过后端 API 拉取
      source: 'user requirement #5'
      risk: low — 时序数据查询是标准需求
    - statement: 单团队使用，无复杂权限系统
      source: Out of Scope 声明
      risk: medium — 若客户后期要求多团队隔离，需要重构
    open_questions:
    - statement: 后端部署位置（边缘 vs 云端）
      source: 架构未确定
      owner: architect
    - statement: 时序数据库选型
      source: 历史数据存储需求
