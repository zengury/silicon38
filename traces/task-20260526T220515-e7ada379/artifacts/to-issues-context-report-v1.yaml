context_compression_report:
  input_scope:
    artifacts_read:
      - artifact_id: "to-prd-output-v1"
        path: "artifacts/to-prd-output-v1.md"
        used: true
        why: "Primary input — PRD defines all user stories, implementation decisions, and scope boundaries"
    handoffs_read:
      - ref: "to-prd→to-issues-20260526-140814.yaml"
