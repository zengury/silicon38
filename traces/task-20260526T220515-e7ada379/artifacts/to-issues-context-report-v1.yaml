        impact: "#7 Config Panel 和 #8 Collaboration 使用 localStorage"
      - statement: "纯 SPA 前端架构"
        source: "to-prd: Implementation Decision #1"
        impact: "所有切片为前端工作，Mock Server 仅辅助开发"
    assumptions:
