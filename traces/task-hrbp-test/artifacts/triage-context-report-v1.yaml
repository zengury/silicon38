context_compression_report:
  input_scope:
    artifacts_read: []
    handoffs_read: []
  retained_context:
    decisions:
    - statement: Task is ambiguous; needs user clarification.
      source: semantic_node_executor
      impact: Affects downstream node execution.
    constraints:
    - statement: No issue details provided.
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    assumptions:
    - statement: The task is a request to triage an issue, but the issue is unspecified.
      source: semantic_node_executor
      risk: Assumption may need review.
    open_questions:
    - statement: What is the specific issue or request?
      source: semantic_node_executor
      owner: runtime
  omitted_context: []
  compression_rationale:
    method: Minimal retention; only the key ambiguity and blocking questions are kept.
    loss_notes: []
  quality_checks:
  - name: scope_boundary_present
    passed: true
  - name: done_condition_present
    passed: true
