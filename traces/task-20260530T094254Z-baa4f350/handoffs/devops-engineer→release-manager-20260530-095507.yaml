    - statement: Multi-stage Dockerfiles for frontend services require repository
        root as build context
      source: devops-engineer analysis
      impact: Changed deploy.yml, ci.yml, and Makefile build configurations. Without
        this fix, portal and admin-web Docker builds would fail at COPY step.
    - statement: Adopt Modular Monolith for backend with Layered Architecture and
        DDD tactical patterns
      source: architect (handoff)
      impact: Single backend service in docker-compose; no microservice orchestration
        needed. CI pipeline builds one backend image.
    - statement: Use pnpm workspace with single root lockfile
      source: devops-engineer verification
      impact: Frontend CI jobs reference root pnpm-lock.yaml as cache key. Docker
        builds must include repo root context for workspace resolution.
    - statement: GitHub Actions for CI/CD (not GitLab CI)
      source: devops-engineer (v1-v5)
      impact: All pipeline configuration in .github/workflows/. Uses GHA-specific
        actions (dorny/paths-filter, docker/build-push-action, slackapi/slack-github-action).
