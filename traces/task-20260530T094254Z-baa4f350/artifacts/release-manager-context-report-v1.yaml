        not running containers.
    - statement: v3.0.0 was never actually deployed to production
      source: semantic_node_executor
      risk: Low — release-plan-v2 was a planning artifact. Broken build contexts would
        have caused failure.
    - statement: Production Nginx config can be updated manually before deployment
      source: semantic_node_executor
      risk: Medium — if forgotten, ALL backend API routes will 404 in production.
    - statement: web_ui yarn usage will be resolved before CI triggers its job
      source: semantic_node_executor
      risk: Medium — if robot/agent/web_ui/ changes, CI will fail because it runs
