        ports to expose, what dependencies each service has.
  compressed_context:
    decisions:
    - statement: Backend Node.js + Express + WebSocket + PostgreSQL + Redis
      source: architect-architecture-v1
      impact: Drives container selection — Node.js backend container, PostgreSQL 16
        container, Redis 7 container. Defines three separate Dockerfiles and docker-compose
        service topology.
    - statement: Frontend React + TypeScript + ECharts + react-grid-layout + react-i18next
      source: architect-architecture-v1
      impact: Drives frontend build pipeline — npm ci + tsc + npm test + npm build
        into Nginx-served static assets.
    - statement: Export via Puppeteer and exceljs on server
      source: architect-architecture-v1
      impact: Requires Chromium binary in Docker — drives Puppeteer-specific Dockerfile
        with alpine chromium package, separate export-worker service.
    - statement: Data retention 30 days
      source: to-prd-prd-v1
      impact: PostgreSQL schema uses time-series partitioning by day. Partition cleanup
        enforces retention. Backup retention aligns with 30-day window.
    - statement: Alert engine rule-based with configurable thresholds
      source: architect-architecture-v1
      impact: Alert configs seeded in init.sql. Thresholds exposed as environment
        variables for runtime tuning without redeploy.
    - statement: Collaboration via WebSocket
      source: architect-architecture-v1
      impact: WebSocket proxy configured in Nginx with long read timeout. Health check
        includes WebSocket upgrade test.
    - statement: Adapter pattern for data normalization
      source: architect-architecture-v1
      impact: No infra impact — adapters are application-layer concerns. Noted for
        completeness.
    constraints:
    - statement: Initial support for 10 robots
      source: to-prd-prd-v1
      impact: Resource sizing (2 backend replicas, 1 export worker, db.t4g.medium
        RDS, cache.t4g.micro) conservatively sized. Scales horizontally when robot
        count grows.
    - statement: Data retention 30 days
      source: to-prd-prd-v1
      impact: PostgreSQL partition strategy enforces this. Backup retention policy
        aligned (daily 7-day + weekly 30-day).
    - statement: Support dark/light theme, multi-language, draggable layout
      source: to-prd-prd-v1
      impact: No infra impact. Frontend-only concern.
    - statement: Data format unification required
      source: to-prd-prd-v1
      impact: No infra impact. Adapter pattern handles this in backend application
        layer.
    assumptions:
    - statement: Robots report via HTTP/WebSocket
      source: to-prd-prd-v1
      risk: If robots use different protocols (MQTT, gRPC, raw TCP), a protocol gateway
        or sidecar may be needed upstream of the backend.
    - statement: Ops team uses desktop browser
      source: to-prd-prd-v1
      risk: No mobile app requirements simplify deployment (no mobile CI/CD needed).
    - statement: Alert notification only in-app initially
      source: to-prd-prd-v1
      risk: No email/SMS gateway integration needed now. If external notifications
        are added, the export worker or a new notification service would need SMTP/SNS
        secrets.
    open_questions:
    - statement: Alert notification channels beyond in-app?
      source: architect-architecture-v1
      owner: runtime
    - statement: Role-based access control needed?
      source: architect-architecture-v1
      owner: runtime
    - statement: Maximum robot scale?
      source: architect-architecture-v1
      owner: runtime
    - statement: Cloud provider and region?
      source: devops-engineer
      owner: runtime
    - statement: Monitoring stack choice (Prometheus/Grafana vs cloud-native)?
      source: devops-engineer
      owner: runtime
