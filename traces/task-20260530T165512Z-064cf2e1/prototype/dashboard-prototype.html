<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Fleet Monitor — PROTOTYPE (THROWAWAY)</title>
<!--
  ⚠️ THROWAWAY PROTOTYPE — NOT FOR PRODUCTION ⚠️
  Question: What layout and interaction model works best for a robot fleet monitoring dashboard?
  Shortcuts: All data is simulated in-memory. No backend. ECharts via CDN. No error handling beyond demo path.
  Variants: A=Grid Dashboard, B=Sidebar Command Center, C=Timeline/Feed
  ?variant=A|B|C to switch. Floating bar at bottom.
  To run: open this file in a browser.
-->
<style>
/* ===== CSS Variables (PROTOTYPE: hardcoded, not from design tokens) ===== */
:root {
  --bg-primary: #f0f2f5;
  --bg-card: #ffffff;
  --bg-sidebar: #001529;
  --text-primary: #1a1a2e;
  --text-secondary: #666;
  --text-muted: #999;
  --border: #e8e8e8;
  --accent: #1890ff;
  --accent-hover: #40a9ff;
  --danger: #ff4d4f;
  --warning: #faad14;
  --success: #52c41a;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg-primary: #141414;
  --bg-card: #1f1f1f;
  --bg-sidebar: #000c17;
  --text-primary: #e8e8e8;
  --text-secondary: #a0a0a0;
  --text-muted: #666;
  --border: #303030;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
body.dark { /* legacy, removed */ }

/* ===== Layout Containers ===== */
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px;
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.app-header .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.app-header .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.app-header .header-actions { display: flex; gap: 12px; align-items: center; }
.app-header .header-actions button {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 13px;
}
.app-header .header-actions button:hover { border-color: var(--accent); color: var(--accent); }
.app-header .header-actions button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ===== Alarm Banner (PROTOTYPE: hardcoded demo alarm) ===== */
.alarm-banner {
  display: flex; align-items: center; gap: 12px;
  margin: 12px 20px; padding: 10px 16px;
  background: #fff2f0; border: 1px solid #ffccc7; border-radius: var(--radius);
  font-size: 14px;
}
[data-theme="dark"] .alarm-banner { background: #2a1215; border-color: #5c1d11; }
.alarm-banner .alarm-icon { font-size: 18px; }
.alarm-banner .alarm-text { flex: 1; color: var(--danger); }
.alarm-banner .alarm-actions { display: flex; gap: 8px; }
.alarm-banner .alarm-actions button {
  padding: 4px 12px; border-radius: 4px; border: 1px solid #ffccc7;
  background: #fff; color: var(--danger); cursor: pointer; font-size: 12px;
}
[data-theme="dark"] .alarm-banner .alarm-actions button { background: #1f1f1f; border-color: #5c1d11; }

/* ===== Variant A: Grid Dashboard ===== */
.variant-a .dashboard-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  padding: 0 20px 80px;
}
.variant-a .card {
  background: var(--bg-card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
  border: 1px solid var(--border);
  min-height: 280px;
  display: flex; flex-direction: column;
}
.variant-a .card.wide { grid-column: span 2; }
.variant-a .card.full { grid-column: span 3; }
.variant-a .card-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.variant-a .card-header h3 { font-size: 15px; font-weight: 600; }
.variant-a .card-header .drag-handle { color: var(--text-muted); cursor: grab; font-size: 14px; }
.variant-a .chart-container { flex: 1; min-height: 0; }

/* ===== Variant B: Sidebar Command Center ===== */
.variant-b { display: flex; min-height: calc(100vh - 56px); }
.variant-b .sidebar {
  width: 260px; background: var(--bg-sidebar); color: #fff;
  padding: 16px 0; flex-shrink: 0; overflow-y: auto;
}
.variant-b .sidebar .robot-item {
  padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  border-left: 3px solid transparent; transition: all 0.15s;
  font-size: 13px;
}
.variant-b .sidebar .robot-item:hover { background: rgba(255,255,255,0.08); }
.variant-b .sidebar .robot-item.active { background: rgba(24,144,255,0.2); border-left-color: var(--accent); }
.variant-b .sidebar .robot-item .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.variant-b .sidebar .robot-item .status-dot.ok { background: var(--success); }
.variant-b .sidebar .robot-item .status-dot.warn { background: var(--warning); }
.variant-b .sidebar .robot-item .status-dot.crit { background: var(--danger); }
.variant-b .main-area { flex: 1; overflow-y: auto; padding: 16px 20px 80px; }
.variant-b .main-area .detail-header { margin-bottom: 16px; }
.variant-b .main-area .detail-header h2 { font-size: 22px; margin-bottom: 4px; }
.variant-b .main-area .detail-header .status-line { font-size: 13px; color: var(--text-secondary); }
.variant-b .main-area .metric-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px;
}
.variant-b .main-area .metric-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; text-align: center;
}
.variant-b .main-area .metric-card .metric-value { font-size: 28px; font-weight: 700; }
.variant-b .main-area .metric-card .metric-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.variant-b .main-area .split-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.variant-b .main-area .split-row .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.variant-b .main-area .split-row .panel h4 { margin-bottom: 8px; font-size: 14px; }
.variant-b .main-area .split-row .panel .chart-inner { height: 240px; }

/* ===== Variant C: Timeline / Feed ===== */
.variant-c { display: flex; min-height: calc(100vh - 56px); }
.variant-c .feed-col { width: 380px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
.variant-c .charts-area { flex: 1; padding: 16px 20px 80px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.variant-c .feed-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
  display: flex; gap: 10px; align-items: flex-start;
}
.variant-c .feed-item .feed-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
.variant-c .feed-item .feed-body { flex: 1; font-size: 13px; }
.variant-c .feed-item .feed-body .feed-robot { font-weight: 600; }
.variant-c .feed-item .feed-body .feed-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.variant-c .charts-area .chart-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; flex: 1; display: flex; flex-direction: column; }
.variant-c .charts-area .chart-panel h4 { margin-bottom: 8px; font-size: 14px; }
.variant-c .charts-area .chart-panel .chart-inner { flex: 1; min-height: 200px; }
.variant-c .charts-area .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ===== Shared: Alarms & Collab panels ===== */
.alarm-list { max-height: 200px; overflow-y: auto; font-size: 13px; }
.alarm-list .alarm-row { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.alarm-list .alarm-row:last-child { border-bottom: none; }
.alarm-list .alarm-row .alarm-sev { padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; }
.alarm-list .alarm-row .alarm-sev.crit { background: #fff2f0; color: var(--danger); }
.alarm-list .alarm-row .alarm-sev.warn { background: #fffbe6; color: #d48806; }
[data-theme="dark"] .alarm-list .alarm-row .alarm-sev.crit { background: #2a1215; }
[data-theme="dark"] .alarm-list .alarm-row .alarm-sev.warn { background: #2b2111; }
.collab-panel { font-size: 13px; }
.collab-panel .collab-msg { padding: 8px 0; border-bottom: 1px solid var(--border); }
.collab-panel .collab-msg:last-child { border-bottom: none; }
.collab-panel .collab-msg .collab-author { font-weight: 600; }
.collab-panel .collab-msg .collab-mention { color: var(--accent); }
.collab-panel .collab-msg .collab-time { font-size: 11px; color: var(--text-muted); }
.collab-panel .collab-input {
  display: flex; gap: 8px; margin-top: 8px;
}
.collab-panel .collab-input input {
  flex: 1; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--bg-card); color: var(--text-primary);
  font-size: 13px;
}
.collab-panel .collab-input button {
  padding: 6px 12px; background: var(--accent); color: #fff;
  border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
}

/* ===== Quick Actions ===== */
.quick-actions { display: flex; flex-direction: column; gap: 8px; }
.quick-actions button {
  padding: 8px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-card); color: var(--text-primary);
  cursor: pointer; font-size: 13px; text-align: left;
}
.quick-actions button:hover { border-color: var(--accent); color: var(--accent); }

/* ===== Floating Switcher Bar (PROTOTYPE: always visible, gated for demo) ===== */
.switcher-bar {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 16px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 30px; padding: 8px 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  z-index: 9999;
  font-size: 13px;
}
.switcher-bar button.arrow {
  background: none; border: none; font-size: 18px; cursor: pointer;
  color: var(--text-primary); padding: 4px 8px; border-radius: 50%;
}
.switcher-bar button.arrow:hover { background: var(--border); }
.switcher-bar .variant-label { font-weight: 600; min-width: 160px; text-align: center; }
.switcher-bar .variant-label .key { color: var(--accent); }
.switcher-bar .variant-name { color: var(--text-muted); font-weight: 400; margin-left: 6px; }

/* ===== Utility ===== */
.hidden { display: none !important; }
.text-success { color: var(--success); }
.text-warning { color: var(--warning); }
.text-danger { color: var(--danger); }

/* ===== Responsive note (PROTOTYPE: desktop-only, not responsive) ===== */
@media (max-width: 900px) {
  .variant-a .dashboard-grid { grid-template-columns: 1fr; }
  .variant-a .card.wide, .variant-a .card.full { grid-column: span 1; }
  .variant-c { flex-direction: column; }
  .variant-c .feed-col { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body data-theme="light">
<!-- ===== Scripts: ECharts via CDN (PROTOTYPE: CDN, no bundler) ===== -->

<!-- ===== APP HEADER (shared across variants) ===== -->
<header class="app-header">
  <div class="logo"><span class="dot"></span> <span data-i18n="appTitle">机器人运维监控面板</span> <span style="font-size:11px;color:var(--warning);background:#fffbe6;padding:2px 6px;border-radius:4px;">THROWAWAY</span></div>
  <div class="header-actions">

<!-- ===== MAIN CONTENT (swapped by variant) ===== -->
<div id="variantContainer"></div>

<!-- ===== FLOATING SWITCHER BAR ===== -->
<div class="switcher-bar" id="switcherBar">
  <button class="arrow" onclick="cycleVariant(-1)" title="Previous (←)">◀</button>

<script>

    cpu: 'CPU',

    variantAGrid: 'Grid Dashboard',
    variantBSidebar: 'Sidebar Command Center',
    variantCTimeline: 'Timeline / Feed',

    location: 'Location',
    history: '30-Day History',

let currentLang = 'zh';
function t(key) { return (i18n[currentLang] && i18n[currentLang][key]) || key; }
function toggleLang() { currentLang = currentLang === 'zh' ? 'en' : 'zh'; renderVariant(currentVariant); }

// --- Theme (PROTOTYPE: CSS variables toggle, no context/provider) ---
function toggleTheme() {
  const body = document.body;
  const current = body.getAttribute('data-theme');
  body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  // Re-render charts on theme change for proper colors
  renderVariant(currentVariant);
}

// --- Simulated Robot Data (PROTOTYPE: in-memory, no DB, 10 robots) ---
// SHORTCUT: data is completely fabricated, not from any real robot protocol
function generateRobots() {
  const names = ['RBT-001','RBT-002','RBT-003','RBT-004','RBT-005','RBT-006','RBT-007','RBT-008','RBT-009','RBT-010'];
  const tasks = ['巡逻-A区', '运输-仓库', '充电中', '巡检-B区', '待命', '运输-产线', '巡逻-C区', '充电中', '巡检-D区', '待命'];
  const statuses = ['ok','ok','crit','warn','ok','ok','warn','ok','ok','ok'];
  const locations = [
    {x: 121.47, y: 31.23}, {x: 121.48, y: 31.24}, {x: 121.46, y: 31.22},
    {x: 121.49, y: 31.23}, {x: 121.47, y: 31.25}, {x: 121.48, y: 31.22},
    {x: 121.46, y: 31.24}, {x: 121.49, y: 31.25}, {x: 121.45, y: 31.23},
    {x: 121.50, y: 31.24}
  ];
  return names.map((n,i) => ({
    id: n, name: n,
    battery: Math.max(5, 90 - i*8 + Math.floor(Math.random()*10)), // RBT-003 at ~60-70
    jointTemp: [35, 42, 38, 55, 33, 41, 37, 82, 40, 36][i] + Math.floor(Math.random()*5),
    cpu: 15 + Math.floor(Math.random()*60),
    latency: 5 + Math.floor(Math.random()*40),
    task: tasks[i],
    status: statuses[i],
    gps: locations[i],
    tilt: i === 2 ? 78 : Math.floor(Math.random()*15), // RBT-003 is fallen
    timestamp: Date.now() - Math.floor(Math.random()*60000)
  }));
}

let robots = generateRobots();
// Simulate live updates (PROTOTYPE: setInterval, not WebSocket)
setInterval(() => {
  robots = robots.map(r => ({
    ...r,
    battery: Math.max(0, Math.min(100, r.battery + (Math.random()-0.5)*3)),
    cpu: Math.max(0, Math.min(100, r.cpu + (Math.random()-0.5)*8)),
    latency: Math.max(1, r.latency + (Math.random()-0.5)*4),
    timestamp: Date.now()
  }));
  if (currentVariant) updateChartsLive();
}, 3000);

// --- Simulated Feed Events (PROTOTYPE: fabricated) ---
const feedEvents = [
  { type: 'alert', robot: 'RBT-003', text: '摔倒检测 — 倾斜角 78°', time: '2分钟前', icon: '🚨' },

// --- Simulated collaboration messages ---
const collabMessages = [
  { author: '王工', text: 'RBT-003 已派工程师去现场', mention: null, time: '3分钟前' },
  { author: '李工', text: '@王工 RBT-008 电量低，是否需要手动召回？', mention: '王工', time: '10分钟前' },
  { author: '张工', text: 'RBT-007 关节温度异常，已标记我在处理', mention: null, time: '25分钟前' },

// --- Simulated alarms ---
const alarms = [
  { robot: 'RBT-003', type: '摔倒', severity: 'crit', time: '2分钟前' },
  { robot: 'RBT-008', type: '电量过低 (18%)', severity: 'warn', time: '5分钟前' },

// --- Simulated 30-day history data (PROTOTYPE: random walk, not real data) ---
// SHORTCUT: generates 720 data points (30 days * 24 hourly samples) but simplified
function generateHistory(days=30) {
  const data = [];
  const now = Date.now();
  for (let i = days*24; i >= 0; i--) {
    const t = now - i * 3600000;
    data.push({
      time: new Date(t).toISOString().slice(0,16).replace('T',' '),
      battery: 50 + 30*Math.sin(i/20) + Math.random()*10,
      cpu: 30 + 20*Math.cos(i/15) + Math.random()*20,
      temp: 40 + 15*Math.sin(i/18) + Math.random()*10,
      latency: 10 + 5*Math.sin(i/12) + Math.random()*15,
    });
  }
  return data;
}

// ================================================================
// VARIANT RENDERING
// ================================================================
let currentVariant = 'A';

// --- Determine variant from URL param (PROTOTYPE: simple, no router) ---
const urlParams = new URLSearchParams(window.location.search);
const variantParam = urlParams.get('variant');
if (variantParam && ['A','B','C'].includes(variantParam.toUpperCase())) {
  currentVariant = variantParam.toUpperCase();
}

function cycleVariant(dir) {
  const variants = ['A','B','C'];
  const idx = variants.indexOf(currentVariant);
  const next = variants[(idx + dir + 3) % 3];
  setVariant(next);
}

function setVariant(v) {
  currentVariant = v;
  // Update URL without reload
  const url = new URL(window.location);
  url.searchParams.set('variant', v);
  window.history.replaceState({}, '', url);
  renderVariant(v);
}

document.addEventListener('keydown', (e) => {
  // Don't intercept arrow keys when focused on input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') cycleVariant(-1);
  if (e.key === 'ArrowRight') cycleVariant(1);
});

function renderVariant(v) {
  const container = document.getElementById('variantContainer');
  const vKey = document.getElementById('variantKey');
  const vName = document.getElementById('variantName');

  // Update switcher bar
  vKey.textContent = v;
  if (v === 'A') vName.textContent = `— ${t('variantAGrid')}`;
  else if (v === 'B') vName.textContent = `— ${t('variantBSidebar')}`;
  else vName.textContent = `— ${t('variantCTimeline')}`;

  // Clear and render
  container.className = '';
  if (v === 'A') {
    container.className = 'variant-a';
    container.innerHTML = renderVariantA();
  } else if (v === 'B') {
    container.className = 'variant-b';
    container.innerHTML = renderVariantB();
  } else {
    container.className = 'variant-c';
    container.innerHTML = renderVariantC();
  }

  // Initialize charts after DOM is ready
  setTimeout(() => {
    if (v === 'A') initChartsA();
    else if (v === 'B') initChartsB();
    else initChartsC();
  }, 50);
}
