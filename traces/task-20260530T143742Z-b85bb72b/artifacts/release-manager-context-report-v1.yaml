    - statement: Compose consolidation into profiles (architect Decision 4, devops-engineer
        v10)
      source: devops-engineer-ops-plan-v10
      impact: Single docker-compose.yml with dev/staging/prod profiles (299 lines).
        Replaces 3 legacy files. Makefile with 35+ targets. .env.example documents
        all variables. deploy.yml still references old file — needs v3.2.1 PATCH.
    - statement: PII-safe logging with 36 RED metrics across 8 services (observability-engineer
        v2)
      source: observability-engineer-design-v2
      impact: structured_log with mask_pii() integrated. Health endpoints with DB+MQTT
        dependency checks. Correlation middleware active in main.py.
    - statement: 7-module database schema design is design-only — NOT shipped in v3.2.0
      source: database-engineer-data-design-v7
      impact: 35 entities in 7 schemas designed. Alembic migrations not written. Raw
        SQL DML remains active. Deferred to v3.4.0.
    - statement: 71 unit tests created (was 0)
      source: senior-engineer-implementation-v8 + tests/ directory survey
      impact: Infrastructure layer has test coverage. Service layer has 0 tests. Coverage
        gap acknowledged in checklist.
    - statement: Version 3.2.0 — MINOR bump
      source: release-manager decision
      impact: No breaking API changes. Substantial new functionality shipped. v3.0.x
        MAJOR lineage preserved.
    constraints:
    - statement: Team size is small; avoid over-engineering
      source: architect-architecture-v1
      impact: Single-host Docker Compose, simple Makefile, no Kubernetes. Compose
        profiles are sufficient.
    - statement: Must maintain backward API compatibility
      source: architect-architecture-v1
      impact: All API paths, response shapes, auth flows unchanged. No MAJOR bump.
        Verified by code review.
    - statement: Incremental refactoring required
      source: architect-architecture-v1
      impact: 10/26 services migrated to DI (38%). Remaining 16 have FIXME annotations.
        Legacy compose files preserved.
    - statement: Backend was previously unstartable (missing core/, infrastructure/,
        ports/ modules)
      source: devops-engineer-ops-plan-v10 (gap discovery)
      impact: Now resolved — all modules exist on disk. Backend can start. CI module-check
        can become blocking.
    - statement: deploy.yml still references docker-compose.prod.yaml
      source: devops-engineer-ops-plan-v10
      impact: Production deploy from CI is broken until fixed. Requires v3.2.1 PATCH.
    assumptions:
    - statement: Backend was previously at version 3.0.1 (based on core/config.py
        APP_VERSION)
      source: semantic_node_executor
      risk: Low — APP_VERSION constant confirms baseline. No prior git tag exists.
    - statement: 10 DI-migrated services behave identically to pre-migration
      source: semantic_node_executor
      risk: 'Moderate — without integration tests, verified by code review only. Mitigation:
        services use same queries, same DB tables.'
    - statement: Old compose files can be removed after 2 release cycles without incident
      source: semantic_node_executor
      risk: Low — if someone has hardcoded old file paths in CI scripts outside the
        repo.
    - statement: Production host has docker compose v2
      source: semantic_node_executor
      risk: Medium — compose profiles require v2 syntax. v1 will fail. Verify before
        deploy.
    open_questions:
    - statement: Should deploy.yml compose command fix ship as v3.2.1 PATCH or block
