context_compression_report:
  input_scope:
    artifacts_read: []
    handoffs_read:
    - ref: handoffs/product-vision-anchor→epic-design-20260601-111313.yaml
      context_digest: 2028ccd4a6b1e6e32ed0fcbd84ab733b9c9dd9bbb3e9a483cc2aaf3a8457e2cc
  retained_context:
    decisions:
    - statement: All features directly supporting install, brand independence, and
        user guidance are KEEP.
      source: scope-prosecutor
      impact: Constrains epic-design to focus on install experience, onboarding, and
        brand surfaces.
    - statement: Internal build tools and daemon deployment are DEFER.
      source: scope-prosecutor
      impact: Epic-design does not redesign internal dev tooling UX — focuses on customer-facing
        touchpoints.
    - statement: Sim pack placeholder is CUT.
      source: scope-prosecutor
      impact: No sim pack onboarding content needed in dashboard.
    - statement: Onboarding dashboard as primary post-install touchpoint (not just
        terminal printout).
      source: epic-design
      impact: New frontend artifact created at docs/brand/manastone-onboarding.html.
        install.sh should auto-open it.
    - statement: Terminal simulator as scene 3 instead of static command reference.
      source: epic-design
      impact: Users see what a conversation feels like before typing. Reduces anxiety
        about natural-language interface.
    - statement: Zero CDN dependencies (vanilla JS only, no GSAP).
      source: epic-design
      impact: Onboarding page works on air-gapped robot networks. Acceptable trade-off
        vs GSAP smoothness.
    - statement: URL parameter (?robot=) for robot model personalization.
      source: epic-design
      impact: install.sh can personalize the dashboard without a backend — passes
        detected model via query string.
    constraints:
    - statement: Must hide pi brand and present Manastone as independent.
      source: product-vision-anchor
      impact: Zero Pi references in all user-visible text, labels, commands, and paths
        in the dashboard.
    - statement: Install must include all dependencies (pi coding agent).
      source: product-vision-anchor
      impact: Dashboard assumes engine is already installed — no engine install instructions
        needed.
    - statement: User guidance must be optimized for clarity.
      source: product-vision-anchor
      impact: Dashboard uses 4-scene narrative arc (Celebration → Orientation → Preview
        → Mastery) to guide the user step by step.
    - statement: Write scope is frontend_experience_scoped.
      source: harness
      impact: This node creates HTML/CSS/JS only. install.sh modifications and Python
        changes are handoff items.
    - statement: Air-gapped robot networks — page must work without internet.
      source: epic-design
      impact: No CDN fonts, no external JS libraries, no API calls. All assets inline.
    assumptions:
    - statement: The core value is a robot agent platform with natural language control
        and diagnosis.
      source: product-vision-anchor
      risk: Assumption may need review.
    - statement: Target users are robotics engineers who have purchased a Unitree
        G1 or Agibot X2.
      source: product-vision-anchor
      risk: Assumption may need review.
    - statement: A browser exists on the target system to render the onboarding dashboard.
      source: epic-design
      risk: Headless robot setups may not have a browser. install.sh should fall back
        to terminal-only UX if no browser detected.
    open_questions:
    - statement: What specific user guidance materials are needed beyond the install
