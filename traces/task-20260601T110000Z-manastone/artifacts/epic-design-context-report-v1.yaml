      source: product-vision-anchor
      owner: runtime
    - statement: How will brand independence be audited across all touchpoints?
      source: product-vision-anchor
      owner: runtime
    - statement: Should install.sh auto-open the onboarding HTML in a browser, or
        print a URL path only?
      source: epic-design
      owner: senior-frontend
    - statement: What robot model display strings should be canonical?
      source: epic-design
      owner: product-vision-anchor
    - statement: Should we add an interactive simulated-conversation mode to the terminal
