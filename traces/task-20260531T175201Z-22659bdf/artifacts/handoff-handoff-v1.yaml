  decisions:
    - decision: "按依赖顺序实施 6 个问题"
      rationale: "静态分析先行确保代码质量，共享工具提供基础，功能结构实现重构，JSDoc 和测试保证可维护性，增量模式确保向后兼容。"
      alternatives_rejected: ["并行实施所有问题", "先重构再添加工具"]
    - decision: "使用向后兼容的 shim 模式进行功能迁移"
      rationale: "现有导入继续工作，模块可以增量迁移，无破坏性变更。"
      alternatives_rejected: ["一次性重写所有导入", "使用 codemod 自动更新导入"]
    - decision: "operation() context manager 仅检测不抑制异常"
      rationale: "调用者保留错误处理控制权，指标/日志作为副作用。"
      alternatives_rejected: ["在 context manager 内部捕获并记录异常", "使用装饰器模式"]
    - decision: "ESLint 配置通过工厂函数共享，而非直接导入"
      rationale: "插件从导入包的 node_modules 解析；工厂函数接受每个包的覆盖。"
      alternatives_rejected: ["直接导出配置对象", "使用预设包"]
    - decision: "功能模块保留原始文件作为向后兼容 shim"
      rationale: "代码库无破坏性变更；提供增量迁移路径。"
      alternatives_rejected: ["删除原始文件并更新所有导入", "创建新文件并弃用旧文件"]
    - decision: "共享 ESLint 配置放在 @roboease/shared 中，而非根目录"
      rationale: "遵循现有工作区依赖图。"
      alternatives_rejected: ["放在根目录 package.json 中", "创建新的共享包"]
  blockers:
