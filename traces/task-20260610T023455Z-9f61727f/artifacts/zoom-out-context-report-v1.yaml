context_compression_report:
  input_scope:
    artifacts_read: []
    handoffs_read: []
  retained_context:
    decisions:
    - statement: Focus on src/ directory as primary area of interest.
      source: semantic_node_executor
      impact: Affects downstream node execution.
    - statement: Identified utils/helpers.py as candidate for deduplication.
      source: semantic_node_executor
      impact: Affects downstream node execution.
    constraints:
    - statement: Timeboxed to one iteration; deep analysis deferred.
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    - statement: No access to runtime or database; static analysis only.
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    assumptions:
    - statement: Codebase structure is representative of actual architecture.
      source: semantic_node_executor
      risk: Assumption may need review.
    - statement: No hidden modules outside src/ are critical.
      source: semantic_node_executor
      risk: Assumption may need review.
    open_questions:
    - statement: Are there any other duplicated utilities beyond helpers.py?
      source: semantic_node_executor
      owner: runtime
    - statement: What is the exact scope of the pipeline's responsibilities?
      source: semantic_node_executor
      owner: runtime
  omitted_context:
  - source: Detailed file contents (not needed for high-level map).
    reason: background_only
  - source: Third-party library versions (not relevant to structure).
    reason: background_only
  compression_rationale:
    method: 'Semantic summarization: extracted module responsibilities, call relationships,
      and data flows from directory structure and file names. Omitted low-level implementation
      details.'
    loss_notes:
    - No loss of critical structural information.
    - Implementation details (e.g., function signatures) omitted but not needed for
      context map.
  quality_checks:
  - name: Module existence verified
    passed: true
  - name: Relationships verified by imports
    passed: true
  - name: External dependencies labeled
    passed: true
