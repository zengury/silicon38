  compressed_context:
    decisions:
    - statement: Classify the request as a feature for internal observability, graph
        visualization, realtime operations UI, and developer experience.
      source: 'explicit user request: build a Three.js realtime Silicon Org 3D operations
        visualizer'
      impact: Downstream nodes should design and implement a runnable visualization
        product, not only documentation.
    - statement: Use Graph, Ledger, Policy, Runtime, and Learning as the primary conceptual
        model.
      source: org/CONTEXT_BLOCK.md
      impact: The UI hierarchy and explanatory layers should reinforce Silicon Org's
        current five-concept model.
    - statement: Recommend UX/design/prototype/architecture before frontend implementation.
      source: triage-analysis-v1.md
      impact: The graph should propagate toward product, UX, prototype, and architecture
        work before coding the full frontend.
    constraints:
    - statement: Only Graph and Ledger facts should be displayed as operational truth;
        Runtime private reasoning is not fact until written to Ledger.
      source: org/CONTEXT_BLOCK.md and org/RUNTIME.md
      impact: The frontend must cite graph or trace sources for displayed state and
        avoid inventing hidden runtime facts.
    - statement: supports, constrains, complements, and augments are context or ordering
        pressure and must not be shown as direct activation edges.
      source: org/CONTEXT_BLOCK.md and org/RUNTIME.md
      impact: Visual edge semantics must distinguish activation-capable relations
        from context-only relations.
    - statement: Activation is dynamic and based on prior outputs; do not preselect
        a whole multi-layer route at task start.
      source: org/CONTEXT_BLOCK.md
      impact: The visualization should show candidates, decisions, deferrals, and
        trace playback rather than a fixed workflow path.
    - statement: Every handoff has both deliverable refs and a digest-linked context_block.
      source: org/HARNESS.md and org/RUNTIME.md
      impact: Handoff animation should include inspectable payloads for deliverable
        metadata and context compression.
    assumptions:
    - statement: A first version can use trace polling or simulated trace playback
        before full realtime streaming.
      source: triage-analysis-v1.md
      risk: If true realtime is required immediately, downstream architecture must
        add event-stream plumbing earlier.
    - statement: The 3D scene should prioritize operational clarity over spectacle.
      source: triage-analysis-v1.md
      risk: A visually impressive but semantically weak scene would fail the user's
        continuity and operations goal.
    - statement: No blocking user question is required before downstream graph propagation.
      source: triage-analysis-v1.md
      risk: Downstream UX or architecture nodes may still surface targeted decisions
        around data source, framework, or layout.
    open_questions: []
