  compressed_context:
    decisions:
    - statement: The visualizer should be driven by Ledger-derived run snapshots.
      source: handoffs/caveman→architect-20260527-144434.yaml context_block and caveman-analysis-v1
      impact: Architecture uses a snapshot adapter/server and keeps the frontend as
        a projection layer.
    - statement: The 3D scene must expose Graph, Policy, Ledger, Runtime, and Learning
        as distinct operational concepts.
      source: org/CONTEXT_BLOCK.md and caveman-analysis-v1
      impact: Architecture includes five visual zones rather than a generic agent
        graph.
    - statement: Minimum viable version should replay an existing trace before adding
        full live transport.
      source: caveman-analysis-v1
      impact: Architecture starts with polling/replay and defers WebSocket or LangGraph
        event streaming.
    - statement: Handoff blocks must be visible objects carrying deliverable metadata
        and compressed context-block data.
      source: user request and handoffs/caveman→architect-20260527-144434.yaml context_block
      impact: Architecture defines a HandoffBlock schema and scene animation/inspector
        behavior.
    - statement: LangGraph is optional and cannot become the organization brain.
      source: org/RUNTIME.md and org/CONTEXT_BLOCK.md
      impact: Architecture treats future LangGraph events as adapter input only, with
        Ledger-backed facts authoritative.
    constraints:
    - statement: Ledger facts, not private runtime reasoning, must drive visual state.
      source: org/RUNTIME.md and org/CONTEXT_BLOCK.md
      impact: Node status, handoff blocks, policy gates, artifacts, and learning signals
        are normalized from trace files.
    - statement: Context-only relations cannot activate nodes.
      source: org/RUNTIME.md
      impact: Edge schema distinguishes activation-capable relations from context/pressure
        relations.
    - statement: Do not create new top-level concepts beyond Graph, Ledger, Policy,
        Runtime, and Learning.
      source: org/CONTEXT_BLOCK.md
      impact: The scene uses these as conceptual anchors; visual zones do not introduce
        competing domain concepts.
    - statement: The first visualizer should be local and read-only.
      source: architect judgment from upstream MVP constraints
      impact: The server exposes snapshot APIs but no mutation or runtime command
        endpoints in v1.
    assumptions:
    - statement: A local Vite, TypeScript, and Three.js frontend is acceptable for
        the prototype.
      source: user explicitly requested Three.js framework
      risk: If repo packaging preferences differ, the snapshot schema can survive
        a frontend tool change.
    - statement: A small Python snapshot adapter can read current YAML traces and
        serve JSON.
      source: current repo uses Python ledger/runtime tools
      risk: If dependencies are later standardized around Node, the adapter boundary
        should remain stable.
    - statement: Polling at roughly 500-1000 ms is sufficient for local operational
        visibility in v1.
      source: architect implementation tradeoff
      risk: High-frequency runtime animation may later require SSE or WebSocket transport.
    open_questions:
    - statement: Which trace should become the canonical demo trace after this run
        completes?
      source: caveman-analysis-v1
      owner: prototype
    - statement: Should the snapshot server use only Python stdlib or allow a small
        web framework?
      source: architect-architecture-v1
      owner: senior-engineer
    - statement: Should the read-only viewer later become an authenticated control
        plane?
      source: architect-architecture-v1
      owner: api-designer
