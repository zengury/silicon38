  compressed_context:
    decisions:
    - statement: The visualizer is an internal observability and graph-visualization
        feature, not a generic dashboard.
      source: triage-analysis-v1
      impact: The UX spec centers Silicon Org's own Graph, Ledger, Policy, Runtime,
        Learning, handoffs, and context blocks.
    - statement: The UI must use Graph, Ledger, Policy, Runtime, and Learning as the
        primary conceptual model.
      source: handoffs/triage→ux-researcher-designer-20260527-144434.yaml context_block
        b185c9e416e3a26fe95dbe83bc0af2ed927534489141eba4c1ca9d626346848a
      impact: Information architecture and scene layout avoid adding competing top-level
        concepts.
    - statement: Ledger-derived run snapshots should be the source of truth for visual
        state.
      source: handoffs/caveman→ux-researcher-designer-20260527-144434.yaml context_block
        90427156b43a9897afd79e4b9e1c6e0183e75613adaea5bde19628173dad9d4c
      impact: The spec requires every operational fact to cite Graph or Ledger sources.
    - statement: Handoff blocks must be visible objects carrying deliverable metadata
        and context_block data.
      source: caveman-analysis-v1
      impact: The UX spec defines moving handoff block objects and a structured block
        inspector.
    - statement: MVP should replay existing traces before adding full realtime runtime
        transport.
      source: caveman-analysis-v1
      impact: Realtime controls are designed around shared demo, replay, and live
        snapshot modes.
    - statement: The 3D layout should be deterministic rather than uncontrolled physics.
      source: caveman-analysis-v1
      impact: The UX spec prioritizes spatial memory and comparable runs.
    constraints:
    - statement: Only Graph and Ledger facts should be displayed as operational truth.
      source: handoffs/triage→ux-researcher-designer-20260527-144434.yaml context_block
        b185c9e416e3a26fe95dbe83bc0af2ed927534489141eba4c1ca9d626346848a
      impact: Node status, handoffs, context digests, and decisions are source-cited
        in the design.
    - statement: supports, constrains, complements, and augments are context or ordering
        pressure and must not be shown as direct activation edges.
      source: handoffs/triage→ux-researcher-designer-20260527-144434.yaml context_block
        b185c9e416e3a26fe95dbe83bc0af2ed927534489141eba4c1ca9d626346848a
      impact: Edge visual semantics separate activation-capable relations from context-only
        relations.
    - statement: Activation is dynamic and based on prior outputs; do not preselect
        a whole multi-layer route at task start.
      source: org/CONTEXT_BLOCK.md
      impact: The spec shows candidates, decisions, deferrals, gates, and timeline
        replay rather than one fixed workflow.
    - statement: Every handoff has both deliverable refs and a digest-linked context_block.
      source: org/RUNTIME.md and org/HARNESS.md
      impact: The block inspector includes deliverable, context block, and digest-chain
        tabs.
    - statement: The UI must not replace Graph, Policy, Ledger, Runtime, or Learning
        logic.
      source: triage-analysis-v1
      impact: The spec explicitly excludes execution controls and graph editing from
        v1.
    assumptions:
    - statement: A Three.js scene is acceptable and useful for the first visual prototype.
      source: explicit user request and caveman-analysis-v1
      risk: If later embedded in a different frontend surface, the normalized snapshot
        contract should protect the UX from framework churn.
    - statement: A trace-to-snapshot adapter can normalize YAML Graph and Ledger files.
      source: caveman-analysis-v1
      risk: If historical traces differ by schema version, the frontend needs tolerant
        partial rendering and source warnings.
    - statement: Operators need replay as much as live status.
      source: triage-analysis-v1 and caveman-analysis-v1
      risk: A live-only UI would show current state but fail to explain why the state
        happened.
    - statement: The first visualizer should observe rather than control Silicon Org.
      source: ux-researcher-designer judgment from upstream scope constraints
      risk: Adding node execution or graph mutation controls in v1 would mix observability
        with governance and enlarge security/policy scope.
    open_questions:
    - statement: Which trace should become the canonical demo fixture for v1?
      source: caveman-analysis-v1
      owner: architect
    - statement: Should live mode use polling first or wait for a runtime event stream
        adapter?
      source: ux-researcher-designer-ux-spec-v1
      owner: architect
    - statement: Should the first demo allow trace folder selection or ship with one
        bundled trace?
      source: caveman-analysis-v1
      owner: prototype
