  compression_rationale:
    method: Retained only product-shaping decisions, hard Silicon Org constraints,
      interface/data assumptions, and open questions that affect downstream architecture,
      UX, prototype, and frontend work.
    loss_notes:
    - Exact graph node and edge inventories were not copied; downstream implementation
      should read ontology files directly for authoritative counts and metadata.
    - Runtime command examples were omitted because the PRD specifies product behavior
      rather than node execution procedure.
    - Repeated statements about Ledger truth and five core concepts were consolidated
      to reduce downstream noise without weakening constraints.
