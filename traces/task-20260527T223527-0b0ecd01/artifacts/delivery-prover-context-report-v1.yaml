    - name: "api_snapshot_counts_verified"
      passed: true
    - name: "browser_canvas_rendered"
      passed: true
    - name: "no_external_browser_requests"
      passed: true
    - name: "security_remediations_verified"
      passed: true
    - name: "policy_cli_validates_reports"
      passed: true
