  retained_context:
    decisions:
    - statement: The visualizer API is local and read-only in v1.
      source: architect-architecture-v1.md and handoffs/architect→api-designer-20260527-145527.yaml
      impact: The contract exposes only GET endpoints and excludes runtime commands,
        graph edits, artifact approval, and learning mutations.
    - statement: The frontend consumes normalized JSON snapshots rather than raw YAML
        files.
      source: architect-architecture-v1.md
      impact: The API centers on /api/runs/{task_id}/snapshot and /api/runs/{task_id}/events.
    - statement: Ledger facts are authoritative for durable visual state.
      source: architect-context-report-v1.yaml
      impact: Every graph, node status, handoff block, policy gate, and learning object
        preserves source refs.
    - statement: Handoff blocks are first-class API objects.
      source: architect-architecture-v1.md
      impact: The contract includes deliverable slices, context-block summaries, digest
        chains, and previous block refs.
    - statement: Polling and deterministic replay come before SSE, WebSocket, or LangGraph
        event bridges.
      source: architect-architecture-v1.md
      impact: Polling expectations and idempotent event application are specified
        explicitly.
    constraints:
    - statement: Context-only relations cannot activate nodes.
      source: architect-context-report-v1.yaml
      impact: Relation schemas include activation_capable and evaluation_reverse_aware
        fields.
    - statement: Do not introduce a second source of truth.
      source: architect-architecture-v1.md
      impact: Errors and warnings expose parse issues instead of hiding or repairing
        trace facts silently.
    - statement: Graph, Policy, Ledger, Runtime, and Learning remain the visible top-level
        concepts.
      source: architect-context-report-v1.yaml
      impact: The API organizes data around those concepts without adding competing
        domain abstractions.
    assumptions:
    - statement: A Python adapter can normalize YAML traces and serve JSON locally.
      source: architect-architecture-v1.md
      risk: Implementation may later choose FastAPI or stdlib HTTP, but the JSON contract
        should remain stable.
    - statement: Polling at 500-1000 ms is sufficient for v1 local live observability.
      source: architect-context-report-v1.yaml
      risk: A future high-frequency runtime feed may need SSE/WebSocket while preserving
        the same durable snapshot schema.
    - statement: Learning index files may be absent or stale during early prototype
        runs.
      source: api-designer judgment from current trace state
      risk: The contract returns empty arrays plus warnings rather than failing snapshots.
    open_questions:
    - statement: Should v1 implementation use only Python stdlib or a small web framework?
      source: architect-context-report-v1.yaml
      owner: senior-engineer
    - statement: Which trace becomes the canonical demo trace after this run completes?
      source: architect-context-report-v1.yaml
      owner: prototype
    - statement: Should the read-only viewer later become an authenticated control
        plane?
      source: architect-context-report-v1.yaml
      owner: future-api-designer
