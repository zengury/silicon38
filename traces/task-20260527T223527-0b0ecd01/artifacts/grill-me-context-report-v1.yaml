  retained_context:
    decisions:
    - statement: 'Verdict is ISSUES_TO_ADDRESS: the design direction is sound but
        must tighten trace completeness, digest verification, handoff semantics, visual
        level-of-detail, and delivery verification before implementation.'
      source: grill-me-review-v1
      impact: Downstream architect, UX, prototype, frontend, and delivery-prover work
        should address these gates before convergence.
    - statement: Ledger-derived snapshots remain the correct source of truth for the
        visualizer.
      source: to-prd-prd-v1, architect-architecture-v1, ux-researcher-designer-ux-spec-v1
      impact: The UI must continue to render only Graph/Ledger-backed operational
        facts or mark missing facts as not recorded.
    - statement: The visualizer should remain read-only in v1.
      source: architect-architecture-v1 and ux-researcher-designer-ux-spec-v1
      impact: No graph editing, node execution, policy mutation, artifact approval,
        or learning updates should be exposed from the first UI.
    - statement: Operator-default level-of-detail is required.
      source: grill-me-review-v1
      impact: The first viewport should emphasize active causal paths, candidates,
        gates, recent handoffs, and evidence chains before showing full topology detail.
    constraints:
    - statement: The current trace is still propagating, not delivered.
      source: traces/task-20260527T223527-0b0ecd01/manifest.yaml and state.yaml
      impact: Any demo or replay based on this trace must be labeled in-progress/not
        converged rather than complete.
    - statement: Digest integrity must not be implied unless verification has actually
        run.
      source: org/CONTEXT_BLOCK.md, org/HARNESS.md, and grill-me-review-v1
      impact: Snapshot adapter should expose verified/missing/mismatch/not_checked
        status for context-block chains.
    - statement: Handoff animation must distinguish durable facts from replay reconstruction.
      source: events.yaml, handoff files, and grill-me-review-v1
      impact: A handoff file can drive replay animation, but the UI cannot claim live
        receipt or consumption without a corresponding fact.
    - statement: Browser and canvas verification must be a concrete delivery gate.
      source: to-prd-prd-v1 AC11 and grill-me-review-v1
      impact: Delivery should require graph count assertions, nonblank canvas pixel
        checks, desktop/mobile screenshots, inspector interaction checks, reduced-motion
        behavior, and source-ref coverage.
    - statement: If artifact content is served over HTTP, local read-only status is
        not enough to skip file-safety constraints.
      source: architect-architecture-v1 API proposal and grill-me-review-v1
      impact: API must restrict reads to manifest-registered refs and reject path
        traversal, or security-engineer should be reactivated.
    assumptions:
    - statement: A Three.js scene is still justified if it explains handoff movement,
        policy gates, and evidence chains rather than acting as decorative topology.
      source: caveman-analysis-v1, PRD, architecture, UX
      risk: Without LOD and evidence-first defaults, the visualizer becomes spectacle
        over operational clarity.
    - statement: The first implementation will include a snapshot adapter/server or
        static export boundary before frontend components consume data.
      source: architect-architecture-v1
      risk: If frontend components parse raw YAML directly, schema drift and provenance
        handling will spread through the UI.
    - statement: Demo, replay, and live modes can share one normalized snapshot schema.
      source: PRD and UX
      risk: Mode labels must prevent generated demo data from being mistaken for durable
        Ledger truth.
    open_questions:
    - statement: Which trace becomes the canonical demo fixture?
      source: to-prd-prd-v1, architect-architecture-v1, ux-researcher-designer-ux-spec-v1,
        grill-me-review-v1
      owner: architect/prototype
    - statement: Will artifact content be served over HTTP or only metadata?
      source: architect-architecture-v1 and grill-me-review-v1
      owner: api-designer/senior-engineer
    - statement: Will digest verification run in v1 or be surfaced as not_checked
        until later?
      source: ux-researcher-designer-ux-spec-v1 and grill-me-review-v1
      owner: senior-engineer
