      passed: true
    - name: "all_used_upstream_artifacts_cited"
      passed: true
    - name: "retains_graph_policy_ledger_runtime_learning_model"
      passed: true
    - name: "retains_ledger_as_source_of_truth_constraint"
      passed: true
    - name: "retains_context_only_relation_constraint"
      passed: true
    - name: "prd_requirements_are_testable"
      passed: true
    - name: "yaml_parseable"
