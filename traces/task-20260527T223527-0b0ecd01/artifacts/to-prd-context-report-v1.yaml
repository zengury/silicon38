context_compression_report:
  input_scope:
    artifacts_read:
      - artifact_id: triage-analysis-v1
        used: true
        why: "Provided task classification, scope, constraints, risks, recommended downstream graph candidates, and done conditions."
      - artifact_id: caveman-analysis-v1
        used: true
        why: "Provided first-principles product shape, minimum viable version, complexity cuts, essential data contract, and build order."
    handoffs_read:
      - ref: handoffs/triage→to-prd-20260527-144434.yaml
        context_digest: 6cd1b49c5a5163e76e9d64f2603178a27b64cf84ff2487664a1387c2277a8ea7
      - ref: handoffs/caveman→to-prd-20260527-144434.yaml
        context_digest: 93dfa50d9418a38365a1c419b0b5d968267bf8cc847551f1e22456e007a8424d
  retained_context:
    decisions:
      - statement: "The visualizer is a Silicon Org internal observability and operations feature, not a generic multi-agent dashboard."
        source: "triage-analysis-v1 and handoffs/triage→to-prd-20260527-144434.yaml"
        impact: "PRD requirements center on Silicon Org's own Graph, Policy, Ledger, Runtime, Learning, handoffs, and context blocks."
      - statement: "Ledger-derived run snapshots are the frontend source of truth."
        source: "caveman-analysis-v1 and handoffs/caveman→to-prd-20260527-144434.yaml"
        impact: "The PRD requires a normalized snapshot contract and forbids rendering private Runtime reasoning as fact."
      - statement: "MVP should prove trace replay or near-realtime polling before full live runtime transport."
        source: "caveman-analysis-v1 and triage-analysis-v1"
        impact: "Realtime behavior is specified as polling/replay first, with a later stream-compatible data contract."
      - statement: "Handoff blocks must be visible, animated, and inspectable."
        source: "explicit user request and caveman-analysis-v1"
        impact: "The PRD requires handoff block animation and a side inspector for deliverable refs, context-block contents, and digest chains."
      - statement: "The UI must expose Graph, Policy, Ledger, Runtime, and Learning as first-class surfaces."
        source: "org/CONTEXT_BLOCK.md, triage-analysis-v1, and caveman-analysis-v1"
        impact: "The interface design requires separate visible surfaces for all five concepts."
    constraints:
      - statement: "Ledger facts, not private Runtime reasoning, must drive visual operational state."
        source: "org/CONTEXT_BLOCK.md, org/RUNTIME.md, and both to-prd handoffs"
        impact: "Every displayed operational fact must cite a graph or ledger source, and missing facts render as not recorded."
      - statement: "Context-only relation types must not be shown as direct activation edges."
        source: "org/RUNTIME.md and handoffs/triage→to-prd-20260527-144434.yaml"
        impact: "The PRD requires visual distinction between activation-capable and context-only relations."
      - statement: "Activation is dynamic and based on prior outputs, not a preselected whole path."
        source: "org/CONTEXT_BLOCK.md and triage-analysis-v1"
        impact: "The product must show candidates, skips, deferrals, policy gates, and trace playback."
      - statement: "The visualizer must not replace Graph, Policy, Ledger, Runtime, or Learning behavior."
        source: "triage-analysis-v1"
        impact: "Non-goals explicitly exclude policy mutation, node execution, graph editing, and new sources of truth in MVP."
      - statement: "Deterministic layout is preferred over uncontrolled physics for operational understanding."
        source: "caveman-analysis-v1"
        impact: "The PRD makes stable node positions a testable requirement."
    assumptions:
      - statement: "A local web app using Three.js or a Three.js-backed view is acceptable for the first product slice."
        source: "explicit user request and caveman-analysis-v1"
        risk: "If the final frontend must be embedded elsewhere, the data adapter and snapshot contract need to remain framework-neutral."
      - statement: "A trace-to-snapshot adapter can normalize current graph and ledger files for the UI."
        source: "caveman-analysis-v1"
        risk: "Trace schema drift may require tolerant parsing and versioned snapshots."
      - statement: "Near-realtime polling within two seconds is enough for MVP."
        source: "triage-analysis-v1 and PRD synthesis"
        risk: "If true streaming is required immediately, architecture must add event-stream plumbing earlier."
      - statement: "The current graph size is manageable for direct Three.js rendering."
        source: "triage-analysis-v1"
        risk: "Labels, particles, and detailed panels may still clutter the scene without filtering and level-of-detail controls."
    open_questions:
      - statement: "Which trace should become the canonical demo trace for first delivery?"
        source: "caveman-analysis-v1"
        owner: "architect"
      - statement: "Should MVP trace selection be fixed, dropdown-based, or file-picker-based?"
        source: "caveman-analysis-v1 and PRD synthesis"
        owner: "ux-researcher-designer"
      - statement: "Should the frontend live as a static viewer generated from snapshots or as a dev-server app with a lightweight local API?"
        source: "caveman-analysis-v1"
        owner: "architect"
  omitted_context:
    - source: "full org/RUNTIME.md command syntax"
      reason: "background_only"
    - source: "full org/CONTEXT_BLOCK.md prose"
      reason: "background_only"
    - source: "full ontology/nodes.yaml and ontology/relations.yaml contents"
      reason: "background_only"
    - source: "triage recommended downstream candidate list details"
      reason: "background_only"
    - source: "complete upstream completion_report prose"
      reason: "duplicate"
  compression_rationale:
    method: "Retained only product-shaping decisions, hard Silicon Org constraints, interface/data assumptions, and open questions that affect downstream architecture, UX, prototype, and frontend work."
    loss_notes:
      - "Exact graph node and edge inventories were not copied; downstream implementation should read ontology files directly for authoritative counts and metadata."
      - "Runtime command examples were omitted because the PRD specifies product behavior rather than node execution procedure."
      - "Repeated statements about Ledger truth and five core concepts were consolidated to reduce downstream noise without weakening constraints."
  quality_checks:
