  retained_context:
    decisions:
    - statement: Implementation should start with a normalized snapshot exporter before
        frontend rendering.
      source: to-prd-prd-v1 and architect-architecture-v1
      impact: All downstream slices depend on a stable contract that keeps raw YAML
        and trace parsing out of rendering components.
    - statement: The local server is read-only in MVP.
      source: architect-architecture-v1
      impact: Issue slices exclude graph editing, policy decisions, artifact approval,
        handoff creation, learning updates, and runtime commands.
    - statement: Three.js scene should use deterministic layout and five operating
        surfaces.
      source: to-prd-prd-v1, architect-architecture-v1, and prototype-plan-v1
      impact: Frontend slices include Graph, Policy, Ledger, Runtime, and Learning
        surfaces and avoid uncontrolled layout physics by default.
    - statement: Handoff blocks are first-class inspectable objects.
      source: to-prd-prd-v1 and prototype-plan-v1
      impact: A dedicated slice covers animation plus inspector details for deliverables,
        context digests, previous blocks, retained context, and quality checks.
    - statement: Replay and live polling should use the same normalized event model.
      source: to-prd-prd-v1 and architect-architecture-v1
      impact: Timeline/replay work is split after the server and state projection
        are available, preserving a future streaming upgrade path.
    - statement: Learning is visible but advisory.
      source: to-prd-prd-v1 and architect-architecture-v1
      impact: Learning gets its own surface and tests, but no slice lets learning
        proposals override Policy gates.
    constraints:
    - statement: Ledger-derived facts remain the source of truth for displayed operational
        state.
      source: handoffs/to-prd→to-issues-20260527-145526.yaml and to-prd-prd-v1
      impact: Every implementation slice includes source references, not-recorded
        states, or explicit invalid markers.
    - statement: Context-only relations must not be styled as direct activation paths.
      source: handoffs/to-prd→to-issues-20260527-145526.yaml and architect-architecture-v1
      impact: Graph normalization and policy slices explicitly test relation-type
        classification.
    - statement: Activation is dynamic based on previous outputs, not a preselected
        path.
      source: handoffs/to-prd→to-issues-20260527-145526.yaml
      impact: Policy gates, candidates, skipped/deferred decisions, and timeline replay
        are separate deliverables.
    - statement: The frontend must not parse raw Graph/Ledger files inside rendering
        components.
      source: to-prd-prd-v1 and architect-architecture-v1
      impact: Snapshot exporter/server slices precede Three.js scene implementation.
    - statement: The visualizer must work without an active runtime.
      source: to-prd-prd-v1 and prototype-plan-v1
      impact: Demo trace selection and replay are explicit slices rather than follow-up
        polish.
    assumptions:
    - statement: A local Vite + TypeScript + Three.js or React Three Fiber app is
        acceptable for the first production path.
      source: architect-architecture-v1 and prototype-plan-v1
      risk: Repository packaging may still choose a different app folder or framework
        boundary.
    - statement: Polling within two seconds satisfies MVP realtime behavior.
      source: to-prd-prd-v1
      risk: If live runtime streaming becomes mandatory immediately, SSE/WebSocket/LangGraph
        bridge work must move earlier.
    - statement: Current graph size can be rendered directly if filters and deterministic
        layout are provided.
      source: prototype-plan-v1
      risk: All 35 nodes and 122 edges may still require label level-of-detail and
        focused views.
    - statement: Learning data may be absent in early traces.
      source: to-prd-prd-v1
      risk: Learning surface must have a useful empty state and fixtures for populated
        verification.
    open_questions:
    - statement: Where should the production visualizer app live in the repository?
      source: architect-architecture-v1 and prototype-plan-v1
      owner: senior-frontend
    - statement: Which trace should become the canonical demo trace after this run
        converges?
      source: to-prd-prd-v1
      owner: runtime
    - statement: Should the first live transport after polling be SSE, WebSocket,
        or a LangGraph event bridge?
      source: architect-architecture-v1 and prototype-plan-v1
      owner: architect
    - statement: Should graph editing remain permanently out of scope or become a
        separate authenticated control plane?
      source: to-prd-prd-v1 non-goals
      owner: silicon_org_builder
