  compression_rationale:
    method: Retained implementation-ordering decisions, hard source-of-truth constraints,
      activation semantics, required vertical slices, and open questions that change
      issue dependencies.
    loss_notes:
    - Exact endpoint and schema snippets were not duplicated in the issue body; downstream
      implementers should read architect-architecture-v1 for precise field contracts.
    - Exact PRD requirement IDs were compressed into acceptance criteria to keep slices
      independently actionable.
    - Full UI visual language was not copied because senior-frontend and ui-design-system
      artifacts should own final styling details.
