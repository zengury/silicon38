## Improvement Recommendations

### For the Protocol

| Issue | Recommendation |
|-------|---------------|
| Ledger writes are manual & frequent | Add a `ledger` tool or script that the Runtime can invoke to auto-write events/provenance |
| Subagent activation is ceremony without diversity | In single-model setups, collapse node execution into "role-play" mode: read harness, think as the node, produce artifact — but don't force subprocesses |
| Convergence checking is complex | Implement a `convergence-check` helper that reads state.yaml and returns go/no-go |
| Evaluator is important but always skipped | Run evaluator as the **first step of the next task**, not the last step of this one — so it's never competing with delivery urgency |

### For This Specific Execution

| Gap | Fix |
|-----|-----|
| state.yaml frozen | Post-hoc update with actual node states, event stream, convergence |
| No handoffs | Write compressed handoff records from the logical trace |
