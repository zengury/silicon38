## Root Cause Analysis

### 1. Single-Agent vs. Multi-Agent Tension

The protocol assumes a multi-agent substrate where:
- The Runtime is a **conductor** that spawns subagents
- Each subagent reads its own harness + skill
- Handoffs carry context between subagents
- Graph edges determine what activates next

In practice, I (Claude/the coding agent) am a **single process**. Spawning
subagents is an artificial ceremony — the same model with the same context
would do the same work. The protocol adds overhead without adding
decision diversity when all agents share a latent space.

### 2. Ledger Lag

The ledger was initialized in Phase 0, then **never updated during
execution**. This happened because:
- Writing ledger entries is a **side task** that competes with the main task
- There's no automatic mechanism — the Runtime must remember to write
- The protocol's write frequency is high (per node, per handoff, per event)
- In a fast iteration loop, ledger updates feel like friction

### 3. Overhead Without Tooling

The protocol requires:
- `traces/<id>/artifacts/<id>.provenance.yaml` per artifact
- `traces/<id>/handoffs/<from>→<to>.yaml` per edge
- `node_activated`, `node_completed` events per step
- Regular `state.yaml` convergence updates

This is ~2-3 additional write operations per node. For a 5-node trace,
that's 10-15 extra file writes. Manual execution makes this prohibitive.

