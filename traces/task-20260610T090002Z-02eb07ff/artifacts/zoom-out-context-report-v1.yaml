context_compression_report:
  input_scope:
    artifacts_read: []
    handoffs_read: []
  retained_context:
    decisions:
    - statement: Focus on top-level modules for initial map.
      source: semantic_node_executor
      impact: Affects downstream node execution.
    - statement: Use codebase's own module names and domain terms.
      source: semantic_node_executor
      impact: Affects downstream node execution.
    constraints:
    - statement: Only top-level structure was examined; deeper analysis requires reading
        individual files.
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    - statement: External dependency versions are not verified.
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    assumptions:
    - statement: Codebase structure is representative of actual module responsibilities.
      source: semantic_node_executor
      risk: Assumption may need review.
    - statement: External dependencies are correctly identified from imports.
      source: semantic_node_executor
      risk: Assumption may need review.
    open_questions:
    - statement: What specific duplicate code patterns exist?
      source: semantic_node_executor
      owner: runtime
    - statement: Are there any circular dependencies?
      source: semantic_node_executor
      owner: runtime
    - statement: What is the current test coverage?
      source: semantic_node_executor
      owner: runtime
  omitted_context:
  - source: Detailed file-level analysis
    reason: background_only
  - source: Specific duplicate code locations
    reason: background_only
  - source: Test coverage metrics
    reason: background_only
  compression_rationale:
    method: 'Top-level abstraction: only module-level structure and relationships
      are retained; file-level details are omitted as they are not needed for initial
      mapping.'
    loss_notes:
    - File-level dependencies and internal module structure are not captured.
    - Exact duplicate code instances are not identified.
  quality_checks:
  - name: Module existence verified
    passed: true
  - name: Relationships verified by reading imports
    passed: true
