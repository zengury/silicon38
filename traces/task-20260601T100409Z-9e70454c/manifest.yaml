task_summary: 对 zengury/manastone 仓库做一次重新调优。manastone 位于 /Users/ZQ/manastone，是用户最重要的
  repo，经历了多轮迭代，主要功能已验证并在使用，架构已多次迭代。核心问题：1）用户入口和界面——新用户只需安装 manastone 即可包含所有依赖（最重要的是
