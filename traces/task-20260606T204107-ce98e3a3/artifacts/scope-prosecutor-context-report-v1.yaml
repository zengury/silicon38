context_compression_report:
  input_scope:
    artifacts_read:
      - artifact_id: to-prd-prd-v1
        used: true
        why: "PRD defines scope that prosecutor evaluates"
    handoffs_read: []
  retained_context:
    decisions:
      - statement: "MVP core: photo capture → AI recognition → shelf rendering → search"
        source: "scope-prosecutor"
        impact: "defines the irreducible v1 feature set; all architecture/UX must serve these 4 flows"
      - statement: "KEEP 6 features, DEFER 4 (all social: discovery, messaging, notifications, shelf sharing)"
        source: "scope-prosecutor"
        impact: "social infrastructure not needed in v1 backend; reduces scope by ~40%"
      - statement: "v1 core statement: photo-based digitization with search on virtual shelf"
        source: "scope-prosecutor"
        impact: "the vision must anchor around personal utility, not social discovery"
    constraints:
      - statement: "All social features deferred to post-v1"
        source: "scope-prosecutor"
        impact: "backend can skip real-time messaging, WebSocket, similarity engine for v1"
      - statement: "$1.99/month subscription required for business viability"
        source: "scope-prosecutor"
        impact: "IAP must work from day one; no free unlimited tier"
      - statement: "iOS only for initial release"
        source: "to-prd"
        impact: "Apple ecosystem lock for v1; SwiftUI + StoreKit"
    assumptions:
      - statement: "Core value is personal digitization, not social discovery"
        source: "scope-prosecutor"
        risk: "if users expect social features from day one, retention may suffer"
      - statement: "Users will pay $1.99/month for shelf digitization alone"
        source: "scope-prosecutor"
        risk: "market validation needed; price point may need adjustment"
    open_questions:
      - statement: "When to reintroduce social features? (user base > 10k?)"
        source: "scope-prosecutor"
        owner: runtime
  omitted_context:
    - source: "individual feature verdict justifications"
      reason: background_only
  compression_rationale:
    method: "Extracted KEEP/DEFER boundary decisions and their architectural impact. Omitted per-feature reasoning details."
    loss_notes: []
  quality_checks:
    - name: "All feature verdicts summarized with impact"
      passed: true
    - name: "MVP core clearly stated"
      passed: true
