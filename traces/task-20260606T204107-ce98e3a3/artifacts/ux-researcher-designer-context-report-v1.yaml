    decisions:
      - statement: "Three tabs: Shelves (home), Search (primary job), Profile (utilities)"
        source: "ux-researcher-designer"
        impact: "defines the entire app navigation architecture — every feature must fit into one of three tabs"
      - statement: "Shelf grid mirrors physical layout 1:1 using LazyVGrid with row×column positions"
        source: "ux-researcher-designer"
        impact: "preserves spatial memory; search results always show physical location as primary action signal"
      - statement: "Search results always show shelf name + position (row, column)"
        source: "ux-researcher-designer"
        impact: "search is a retrieval command, not just a catalog lookup — the location is the answer"
      - statement: "Confidence indicators (⚠️ badge) always visible when AI confidence < 0.7"
        source: "ux-researcher-designer"
        impact: "builds trust through honesty; user can confirm or edit low-confidence books"
    constraints:
      - statement: "3 tabs maximum — anything else goes in Profile > Settings"
        source: "ux-researcher-designer (Salk: subtraction)"
        impact: "navigation cannot grow beyond 3 items without design review"
      - statement: "Onboarding is 3 cards max, skippable"
        source: "ux-researcher-designer"
        impact: "no multi-step wizard; no mandatory tutorial"
      - statement: "All tap targets minimum 44×44pt"
        source: "ux-researcher-designer"
        impact: "Apple HIG compliance; no small touch zones"
    assumptions:
      - statement: "Users navigate spatially, not through lists"
        source: "ux-researcher-designer"
        risk: "if users don't build spatial memory of their shelves, the grid view wastes screen space"
    open_questions:
