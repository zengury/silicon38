    - statement: No Redis caching at low scale
      source: caveman
      impact: simpler deployment; PostgreSQL alone is sufficient
    - statement: No cosine similarity vectors; simple tag overlap
      source: caveman
      impact: when social features arrive, start simple, not with ML
    assumptions:
