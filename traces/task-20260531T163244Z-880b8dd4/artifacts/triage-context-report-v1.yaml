context_compression_report:
  input_scope:
    artifacts_read: []
    handoffs_read: []
  retained_context:
    decisions:
    - statement: Task is a refactoring task.
      source: semantic_node_executor
      impact: Affects downstream node execution.
    - statement: 'Primary agent: refactoring-agent; secondary: testing-agent.'
      source: semantic_node_executor
      impact: Affects downstream node execution.
    constraints:
    - statement: Must not change external behavior.
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    - statement: 'Codebase path: /Users/ZQ/roboease.'
      source: semantic_node_executor
      impact: Constrains downstream node execution.
    assumptions:
    - statement: User wants to improve maintainability and testability.
      source: semantic_node_executor
      risk: Assumption may need review.
    - statement: Existing tests may exist but are not guaranteed.
      source: semantic_node_executor
      risk: Assumption may need review.
    open_questions:
    - statement: Preferred module structure?
      source: semantic_node_executor
      owner: runtime
    - statement: Existing test preservation?
      source: semantic_node_executor
      owner: runtime
    - statement: Risk tolerance?
      source: semantic_node_executor
      owner: runtime
  omitted_context: []
  compression_rationale:
    method: Extracted only task-relevant information; omitted general triage instructions.
    loss_notes: []
  quality_checks:
  - name: Problem statement is falsifiable
    passed: true
  - name: Scope includes out-of-scope items
    passed: true
  - name: Recommended agents derived from problem
    passed: true
  - name: Blocking questions specific and actionable
    passed: true
