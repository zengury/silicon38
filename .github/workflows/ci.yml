name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[langgraph-oss]'

      - name: Python compile
        run: |
          python -m py_compile tools/policy.py tools/audit.py tools/ledger.py tools/spawn.py tools/scheduler.py tools/org_system_validation.py tools/semantic_node_executor.py runtime/*.py learning/*.py

      - name: YAML parse
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          paths = [
              "ontology/nodes.yaml",
              "ontology/relations.yaml",
              "ontology/relation_types.yaml",
              "traces/index_by_role.yaml",
              "traces/index_by_relation.yaml",
          ]
          for path in paths:
              yaml.safe_load(Path(path).read_text())
          print("yaml parse ok")
          PY

      - name: Context block guard
        run: |
          python tools/ledger.py context | grep sha256

      - name: Graph and repository audit
        run: |
          python tools/audit.py

      - name: LangGraph native runtime smoke
        run: |
          python tools/langgraph_native_smoke.py

      - name: Silicon Org system validation
        run: |
          python tools/org_system_validation.py

      - name: Verify packaged skills
        run: |
          bash install.sh
