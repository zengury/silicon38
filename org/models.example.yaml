# Optional model routing example.
# Copy to org/models.local.yaml for machine/user-specific overrides.
# If omitted, every node uses the Runtime current/default model.
#
# Concrete model IDs belong here, never in ontology/nodes.yaml or relations.yaml.
# Every role can be overridden independently.

schema: silicon_org.model_routing.v1

default:
  provider: runtime
  model: runtime-default
  reasoning_effort: inherit

runner_pools:
  # Fast document/planning nodes. For DeepSeek direct API use provider: deepseek
  # with DEEPSEEK_API_KEY in the environment.
  api_model:
    provider: pi
    model: runtime-default
    reasoning_effort: medium
    session_policy: ephemeral

  # Nodes that write or modify implementation code.
  coding_builder:
    provider: pi
    model: runtime-default
    reasoning_effort: medium
    session_policy: warm

  # Nodes that verify, test, review, or challenge implementation output.
  coding_reviewer:
    provider: pi
    model: runtime-default
    reasoning_effort: high
    session_policy: warm

  # Frontend/prototype nodes that may need browser-oriented tooling.
  frontend_browser:
    provider: pi
    model: runtime-default
    reasoning_effort: medium
    session_policy: warm

